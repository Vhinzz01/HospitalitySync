<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102f36">
    <title>{% block title %}HospitalitySync · Hospitalidade conectada{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/base.css') }}">
    {% block styles %}{% endblock %}
    <script src="{{ url_for('static', path='/js/base.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main">Pular para o conteúdo</a>
    {% block body %}{% endblock %}
    <div class="hs-toast" id="hs-toast" role="status" aria-live="polite"></div>
</body>
</html>
