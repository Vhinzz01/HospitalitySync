{% macro icon(name, size=24) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'room' %}<path d="M4 21V3h12v18M2 21h20M16 7h4v14M8 7h4M8 11h4M8 15h4M11 21v-3"/>
{% elif name == 'kitchen' %}<path d="M3 17h18M5 17a7 7 0 0 1 14 0M12 8V5M10 5h4M3 21h18"/>
{% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 11h18M8 15h2M14 15h2"/>
{% elif name == 'people' %}<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 6"/>
{% elif name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
{% elif name == 'service' %}<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/>
{% elif name == 'tool' %}<path d="M14 4a5 5 0 0 0-6 6L3 15a3 3 0 0 0 4 4l5-5a5 5 0 0 0 6-6l-4 3-3-3Z"/>
{% elif name == 'bell' %}<path d="M5 16h14l-2-3V9a5 5 0 0 0-10 0v4ZM10 20h4"/>
{% elif name == 'arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name == 'device' %}<rect x="5" y="2" width="14" height="20" rx="3"/><path d="M10 18h4"/>
{% else %}<path d="M4 12h16M12 4v16"/>{% endif %}
</svg>
{%- endmacro %}
{% macro brand() -%}<a class="hs-brand" href="/" aria-label="HospitalitySync, início"><span class="hs-mark" aria-hidden="true">H<span>·</span></span><span>Hospitality<span class="brand-light">Sync</span></span></a>{%- endmacro %}
