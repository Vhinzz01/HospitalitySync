services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospitalitysync}
      POSTGRES_USER: ${POSTGRES_USER:-hospitalitysync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hospitalitysync}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-hospitalitysync}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?SESSION_SECRET_KEY must be set}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-28800}
      DEVICE_COOKIE_MAX_AGE_SECONDS: ${DEVICE_COOKIE_MAX_AGE_SECONDS:-31536000}
      # Temporary local preview requested for testing; remove or set false later.
      ENABLE_DEMO_ACCESS: ${ENABLE_DEMO_ACCESS:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    init: true

volumes:
  postgres_data:
